name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.js'
      - 'App.tsx'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Grant the workflow permission to create releases
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Bundle JS for release
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK (signed with debug keystore)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          # Skip proguard/shrinking on CI for faster + more predictable builds
          ORG_GRADLE_PROJECT_enableProguardInReleaseBuilds: 'false'

      - name: Locate APK
        id: locate
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: parly-apk-${{ steps.locate.outputs.sha_short }}
          path: ${{ steps.locate.outputs.apk }}
          retention-days: 7

      - name: Create GitHub pre-release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ steps.locate.outputs.sha_short }}
          name: Dev build ${{ steps.locate.outputs.sha_short }}
          body: |
            Automated dev build from commit ${{ github.sha }}.
            Signed with the committed debug keystore — Android will warn about
            "unknown developer" on install. Enable "install from unknown sources"
            for your browser to sideload.
          prerelease: true
          files: ${{ steps.locate.outputs.apk }}
