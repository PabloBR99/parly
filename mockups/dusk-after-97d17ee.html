<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Parly — Dusk · live preview (iteration 1)</title>
<style>
  /* The page chrome is just a stage; the phone itself paints its own
     atmosphere with a real vertical gradient (DuskBackdrop). */
  html, body {
    margin: 0; padding: 0;
    background: #050507;
    min-height: 100%;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  body { display: grid; place-items: center; padding: 40px; box-sizing: border-box; }

  .phone {
    position: relative;
    width: 380px;
    height: 800px;
    border-radius: 52px;
    overflow: hidden;
    /* DuskBackdrop's 7-stop vertical gradient — periwinkle (top) →
       near-black (centre) → peach-terracotta (bottom). */
    background: linear-gradient(180deg,
      #1B1F38   0%,
      #131525  22%,
      #060609  42%,
      #030305  50%,
      #060406  58%,
      #1A130D  78%,
      #341B10 100%);
    box-shadow:
      0 0 0 1.5px rgba(255,255,255,0.06),
      0 80px 140px -40px rgba(0,0,0,0.85);
  }

  .half {
    position: absolute; left: 0; right: 0;
    height: 50%;
    padding: 36px 24px 24px 24px;
    display: flex; flex-direction: column;
    z-index: 2;
    box-sizing: border-box;
  }
  .half.top { top: 0; transform: rotate(180deg); }
  .half.bot { bottom: 0; }

  /* Welcome placeholder — the new empty-state in the big translation slot. */
  .source { min-height: 38px; }
  .big {
    flex: 1;
    padding: 8px 0;
    display: flex; flex-direction: column;
    justify-content: flex-start;
  }
  .welcome-headline {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 30px;
    line-height: 38px;
    font-weight: 400;
    letter-spacing: -0.4px;
    color: rgba(255,255,255,0.36);
    margin: 0 0 16px 0;
  }
  .welcome-flow { display: flex; flex-direction: row; align-items: center; }
  .welcome-flow span {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 10px;
    letter-spacing: 1.4px;
    color: rgba(255,255,255,0.16);
  }
  .welcome-flow .arrow { margin: 0 12px; letter-spacing: 1px; }

  /* Identity chip — white-outline pill. */
  .identity { display: flex; align-items: center; margin-bottom: 16px; }
  .chip {
    display: flex; align-items: center;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; margin-right: 8px; }
  .chip .endonym {
    font-size: 11px; letter-spacing: 0.8px;
    color: rgba(255,255,255,0.62);
    text-transform: uppercase;
    font-weight: 500;
  }
  .chip .code {
    margin-left: 8px;
    font-family: Georgia, serif; font-style: italic;
    font-size: 11px;
    color: rgba(255,255,255,0.36);
  }
  .chip .chev {
    margin-left: 8px;
    font-family: Georgia, serif; font-style: italic;
    font-size: 11px;
    color: rgba(255,255,255,0.16);
  }

  /* PTT slot. */
  .ptt-slot {
    position: relative;
    height: 200px;
    display: grid; place-items: center;
    margin: -20px 0;
  }

  /* Bloom — three offset stains, each a CSS radial-gradient with the same
     5-stop alpha curve RN's Bloom.tsx uses (0/.22/.50/.80/1 with factors
     1/.78/.50/.22/0). NO filter:blur — RN can't do that, so the preview
     shouldn't either; the long alpha tail on the gradient itself is the
     blur substitute. Container is 340 px (BLOOM_SIZE in RN). */
  .bloom {
    position: absolute;
    width: 460px; height: 460px;
    pointer-events: none;
    /* RN's <Svg><RadialGradient> renders smoother than CSS multi-stop
       radial-gradients on raster — a modest blur here approximates that
       smoothing so the preview tracks what the build actually shows. */
    filter: blur(10px);
  }
  .bloom .stain {
    position: absolute;
    width: 460px; height: 460px;
    border-radius: 50%;
    opacity: 0.96;
  }
  /* Warm — peaks 0.55 / 0.50 / 0.45 (Bloom.tsx ALPHAS.warm). Stain
     offsets match the RN constants (TOP_OFFSET / MID / DEEP). */
  /* Warm — peaks 0.68 / 0.62 / 0.55. */
  .warm .top {
    transform: translate(-64px, -78px);
    background: radial-gradient(circle at 50% 50%,
      rgba(255,179,122,0.68) 0%,
      rgba(255,179,122,0.530) 22%,
      rgba(255,179,122,0.34)  50%,
      rgba(255,179,122,0.150) 80%,
      transparent 100%);
  }
  .warm .mid {
    transform: translate(72px, 48px);
    background: radial-gradient(circle at 50% 50%,
      rgba(255,142,118,0.62) 0%,
      rgba(255,142,118,0.484) 22%,
      rgba(255,142,118,0.31)  50%,
      rgba(255,142,118,0.136) 80%,
      transparent 100%);
  }
  .warm .deep {
    transform: translate(-10px, 88px);
    background: radial-gradient(circle at 50% 50%,
      rgba(226,111,92,0.55) 0%,
      rgba(226,111,92,0.429) 22%,
      rgba(226,111,92,0.275) 50%,
      rgba(226,111,92,0.121) 80%,
      transparent 100%);
  }
  /* Cool — peaks 0.72 / 0.66 / 0.58 (cool retreats; needs extra alpha
     to read at the same luminosity as warm on a near-black surface). */
  .cool .top {
    transform: translate(-64px, -78px);
    background: radial-gradient(circle at 50% 50%,
      rgba(168,178,255,0.72) 0%,
      rgba(168,178,255,0.562) 22%,
      rgba(168,178,255,0.36)  50%,
      rgba(168,178,255,0.158) 80%,
      transparent 100%);
  }
  .cool .mid {
    transform: translate(72px, 48px);
    background: radial-gradient(circle at 50% 50%,
      rgba(127,216,201,0.66) 0%,
      rgba(127,216,201,0.515) 22%,
      rgba(127,216,201,0.33)  50%,
      rgba(127,216,201,0.145) 80%,
      transparent 100%);
  }
  .cool .deep {
    transform: translate(-10px, 88px);
    background: radial-gradient(circle at 50% 50%,
      rgba(156,138,230,0.58) 0%,
      rgba(156,138,230,0.452) 22%,
      rgba(156,138,230,0.29)  50%,
      rgba(156,138,230,0.128) 80%,
      transparent 100%);
  }

  /* Shadow halo — the SVG radial-gradient version we now render. Stops
     identical to PTTButton.tsx (0.55 / 0.42 / 0.18 / 0). 144 × 144 px,
     translateY(8). */
  .halo {
    position: absolute;
    width: 144px; height: 144px;
    border-radius: 50%;
    transform: translateY(8px);
    background: radial-gradient(circle at 50% 50%,
      rgba(0,0,0,0)     0%,
      rgba(0,0,0,0)    55%,
      rgba(0,0,0,0.05) 66%,
      rgba(0,0,0,0.30) 72%,
      rgba(0,0,0,0.14) 85%,
      rgba(0,0,0,0)   100%);
    pointer-events: none;
  }

  /* The disc — transparent body, white hairline border, mockup spec. */
  .disc {
    position: relative;
    width: 96px; height: 96px;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.10);
    display: grid; place-items: center;
  }
  .disc::after {
    content:''; position: absolute; inset: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.14), transparent 60%);
    pointer-events: none;
  }
  .disc .tick {
    width: 14px; height: 1.5px;
    border-radius: 1px;
    background: rgba(255,255,255,0.40);
  }

  /* Edge chrome — "online" / "settings". */
  .edge {
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    color: rgba(255,255,255,0.36);
    font-family: Georgia, serif; font-style: italic;
    font-size: 13px;
    padding-top: 8px;
  }
  .edge .net { width: 6px; height: 6px; border-radius: 50%; background: #7FD8C9; }
</style>
</head>
<body>
  <div class="phone">

    <!-- TOP HALF — partner (cool, rotated 180°) -->
    <div class="half top">
      <div class="source"></div>
      <div class="big">
        <p class="welcome-headline">Press and hold to speak.</p>
        <div class="welcome-flow">
          <span>ESPAÑOL</span>
          <span class="arrow">→</span>
          <span>ENGLISH</span>
        </div>
      </div>
      <div class="identity">
        <div class="chip">
          <span class="dot" style="background:#A8B2FF;"></span>
          <span class="endonym">Español</span>
          <span class="code">es</span>
          <span class="chev">▾</span>
        </div>
      </div>
      <div class="ptt-slot">
        <div class="bloom cool">
          <div class="stain top"></div>
          <div class="stain mid"></div>
          <div class="stain deep"></div>
        </div>
        <div class="halo"></div>
        <div class="disc"><span class="tick"></span></div>
      </div>
      <div class="edge"><span class="net"></span><span>online</span></div>
    </div>

    <!-- BOTTOM HALF — user (warm, upright) -->
    <div class="half bot">
      <div class="source"></div>
      <div class="big">
        <p class="welcome-headline">Press and hold to speak.</p>
        <div class="welcome-flow">
          <span>ENGLISH</span>
          <span class="arrow">→</span>
          <span>ESPAÑOL</span>
        </div>
      </div>
      <div class="identity">
        <div class="chip">
          <span class="dot" style="background:#FF8E76;"></span>
          <span class="endonym">English</span>
          <span class="code">en</span>
          <span class="chev">▾</span>
        </div>
      </div>
      <div class="ptt-slot">
        <div class="bloom warm">
          <div class="stain top"></div>
          <div class="stain mid"></div>
          <div class="stain deep"></div>
        </div>
        <div class="halo"></div>
        <div class="disc"><span class="tick"></span></div>
      </div>
      <div class="edge"><span>settings</span></div>
    </div>

  </div>
</body>
</html>
